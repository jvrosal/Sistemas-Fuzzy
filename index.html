
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef2ee">
  <meta name="description" content="Raiz: simulador didático de irrigação por inferência fuzzy Mamdani.">
  <title>Raiz | Simulador de Irrigação Fuzzy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <p class="brand"><strong>Raiz</strong> <span>Simulador fuzzy de irrigação (Mamdani)</span></p>
      <p class="course">Inteligência Artificial, UFPI 2026.2</p>
      <a class="repo-link" href="https://github.com/jvrosal/Sistemas-Fuzzy" target="_blank" rel="noopener noreferrer">Código no GitHub</a>
    </header>

    <form class="controls" id="controls" novalidate aria-label="Configuração da simulação">
      <div class="field" data-field="humidity">
        <div class="field-row">
          <label for="humidity-input">Umidade do solo</label>
          <span class="number-box">
            <input id="humidity-input" name="humidity" type="number" inputmode="decimal" min="0" max="100" step="any" value="35" aria-describedby="humidity-error">
            <span class="unit">%</span>
          </span>
        </div>
        <input class="slider slider-humidity" id="humidity-slider" type="range" min="0" max="100" step="0.5" value="35" aria-label="Umidade do solo, de 0 a 100 %">
        <p class="field-error" id="humidity-error" role="alert"></p>
      </div>

      <div class="field" data-field="temperature">
        <div class="field-row">
          <label for="temperature-input">Temperatura</label>
          <span class="number-box">
            <input id="temperature-input" name="temperature" type="number" inputmode="decimal" min="10" max="40" step="any" value="30" aria-describedby="temperature-error">
            <span class="unit">°C</span>
          </span>
        </div>
        <input class="slider slider-temperature" id="temperature-slider" type="range" min="10" max="40" step="0.5" value="30" aria-label="Temperatura, de 10 a 40 °C">
        <p class="field-error" id="temperature-error" role="alert"></p>
      </div>

      <fieldset class="rules">
        <legend>Tempo de rega por regra</legend>
        <table class="rule-matrix" data-rule-matrix>
          <caption class="visually-hidden">Consequente de cada regra: linhas indicam o solo, colunas indicam a temperatura</caption>
        </table>
      </fieldset>

      <fieldset class="step-choice">
        <legend>Passo Δz (min)</legend>
        <div class="segmented" data-step-options></div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="button button-primary" data-action="calculate">Calcular</button>
        <button type="button" class="button" data-action="advance">Avançar etapa</button>
        <button type="button" class="button-quiet" data-action="reset">Restaurar padrão</button>
      </div>
    </form>

    <main class="board" aria-labelledby="board-title">
      <h1 id="board-title" class="visually-hidden">Etapas da inferência</h1>
      <ol class="rail" data-stage-list aria-label="Etapas da inferência Mamdani"></ol>
      <section class="view">
        <header class="view-head">
          <h2 data-view-title>Conjuntos do modelo</h2>
          <p class="run-status" data-app-status aria-live="polite">Carregando…</p>
        </header>
        <div class="view-body" data-view-body></div>
      </section>
    </main>
  </div>
</body>
</html>
