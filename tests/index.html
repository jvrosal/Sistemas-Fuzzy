<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testes | Simulador Fuzzy Mamdani</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="./tests.js"></script>
    <style>
      .test-page { max-width: 760px; margin: 52px auto; padding: 0 20px; }
      .test-header { margin-bottom: 22px; }
      .test-header p { color: #778a9b; line-height: 1.6; }
      .test-result { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #edf1f4; font-size: 14px; }
      .test-result span { font-weight: 700; }
      .test-pass { color: #11856b; }
      .test-fail { color: #c33c38; }
      .test-summary { margin-top: 20px; color: #4e697a; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="test-page">
      <div class="test-header">
        <span class="section-kicker">Validação inicial</span>
        <h1 style="color:#14253b;font-size:32px;margin:12px 0">Testes da etapa 00</h1>
        <p>Verificações básicas da estrutura, dos módulos e da inicialização da interface.</p>
      </div>
      <section class="panel" aria-label="Resultados dos testes">
        <div id="test-results" aria-live="polite">Executando testes...</div>
        <p id="test-summary" class="test-summary"></p>
      </section>
      <p style="margin-top:24px"><a href="../index.html" style="color:#087c69">Voltar para o simulador</a></p>
    </main>
  </body>
</html>
